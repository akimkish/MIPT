# products_service/alembic.ini
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url здесь намеренно нет: URL берётся из Settings в env.py,
# чтобы не дублировать секрет подключения между .env и alembic.ini
# и не разъезжаться с тем, что видит приложение.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s